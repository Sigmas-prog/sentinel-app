name: sentinel_app
description: Interactive Marcus-style cyber hub with real Android device data.
publish_to: "none"
version: 3.0.0+4

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  device_info_plus: ^10.1.2
  battery_plus: ^6.0.3
  network_info_plus: ^6.0.1
  wifi_scan: ^0.4.1+2
  permission_handler: ^11.3.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  image_picker: ^1.1.2
  audioplayers: ^6.1.0
  shared_preferences: ^2.3.4
  cached_network_image: ^3.4.1
  sensors_plus: ^5.0.1
  flutter_secure_storage: ^9.2.4
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0
  # 10.3.3+ inherits Flutter's compileSdk instead of hard-coding API 34.
  # Keep this on the latest non-breaking 10.x line because 11.x changes
  # FilePicker calls from instance methods to static methods.
  file_picker: ^10.3.11
  connectivity_plus: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/sentinel_icon.svg
  fonts:
    - family: SentinelMono
      fonts:
        - asset: assets/fonts/DejaVuSansMono.ttf
