name: sentinel_app
description: Interactive Marcus-style cyber hub with real Android device data.
publish_to: "none"
version: 2.0.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  device_info_plus: ^10.1.2
  battery_plus: ^6.0.3
  network_info_plus: ^6.0.1
  wifi_scan: ^0.4.1+2
  permission_handler: ^11.3.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  image_picker: ^1.1.2
  audioplayers: ^6.1.0
  shared_preferences: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/sentinel_icon.png
  fonts:
    - family: SentinelMono
      fonts:
        - asset: assets/fonts/DejaVuSansMono.ttf
