name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android platform files
        run: |
          mv android /tmp/sentinel_android
          flutter create --platforms=android .
          cp /tmp/sentinel_android/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Download packages
        run: flutter pub get

      - name: Check Dart code
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
